name: Refresh basket analytics

on:
  schedule:
    # Daily 17:30 UTC (~11:00 PM IST) after AMFI NAV publish
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-baskets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch NAV history and compute basket metrics
        run: npm run refresh-baskets

      - name: Open PR with refreshed analytics
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          # Optional repo secret BASKET_REFRESH_GH_TOKEN (fine-grained PAT with
          # contents + pull-requests write) if org blocks GITHUB_TOKEN from opening PRs.
          token: ${{ secrets.BASKET_REFRESH_GH_TOKEN || github.token }}
          commit-message: 'chore: refresh FIRE/WATER/EARTH basket NAV analytics'
          title: 'chore: refresh basket NAV analytics'
          body: |
            Automated daily refresh of `api/data/basketAnalytics.json`.

            Merge to update live NAV metrics on Vercel (if auto-deploy on push is enabled).
          branch: chore/basket-nav-refresh
          delete-branch: true
          add-paths: |
            api/data/basketAnalytics.json

      - name: Manual PR link (if automation blocked)
        if: failure() && steps.cpr.outcome == 'failure'
        run: |
          echo "::error::GitHub Actions could not open the pull request."
          echo "1) Org admin: https://github.com/organizations/Anupaat-Nivesh/settings/actions"
          echo "   Enable: Allow GitHub Actions to create and approve pull requests"
          echo "2) Repo: Settings → Actions → General → same checkbox → Save"
          echo "3) Or add secret BASKET_REFRESH_GH_TOKEN (PAT with contents + pull-requests write)"
          echo "4) Open PR manually: https://github.com/${{ github.repository }}/compare/main...chore/basket-nav-refresh?expand=1"
          exit 1
