name: Refresh basket analytics

on:
  schedule:
    # Daily 17:30 UTC ≈ 11:00 PM IST — after AMFI NAV publish
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-baskets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch NAV history and compute basket metrics
        run: npm run refresh-baskets

      - name: Commit analytics if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: refresh FIRE/WATER/EARTH basket NAV analytics'
          file_pattern: api/data/basketAnalytics.json
