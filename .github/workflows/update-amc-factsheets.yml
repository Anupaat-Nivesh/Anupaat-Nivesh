name: Update AMC factsheet index

on:
  schedule:
    # Daily at 02:30 UTC (~8:00 AM IST)
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Refresh AMC page map
        run: npm run update:amc-index

      - name: Discover missing factsheet PDFs
        run: npm run fetch:factsheets -- --only-missing --limit 100
        env:
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}

      - name: Open PR with refreshed factsheet index
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: refresh AMC factsheet index'
          title: 'chore: refresh AMC factsheet index'
          body: |
            Automated refresh of `api/data/amc-document-index.json`.
          branch: chore/amc-factsheet-index-refresh
          delete-branch: true
          add-paths: |
            api/data/amc-document-index.json
