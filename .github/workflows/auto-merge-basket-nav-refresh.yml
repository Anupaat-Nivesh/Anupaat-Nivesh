name: Auto-merge basket NAV refresh PR

# Approves and merges chore/basket-nav-refresh PRs after checks pass.
# Requires repo secret BASKET_REFRESH_GH_TOKEN (PAT from a repo admin — not github-actions[bot]).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: |
      github.event.pull_request.head.ref == 'chore/basket-nav-refresh' &&
      github.event.pull_request.title == 'chore: refresh basket NAV analytics'
    runs-on: ubuntu-latest
    steps:
      - name: Verify only basket analytics JSON changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(gh pr diff "${{ github.event.pull_request.number }}" --name-only)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No file changes in PR."
            exit 0
          fi
          for f in "${files[@]}"; do
            if [ "$f" != "api/data/basketAnalytics.json" ]; then
              echo "::error::Unexpected file in basket refresh PR: $f"
              exit 1
            fi
          done

      - name: Require admin PAT secret
        env:
          HAS_PAT: ${{ secrets.BASKET_REFRESH_GH_TOKEN != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::Add repo secret BASKET_REFRESH_GH_TOKEN (admin PAT) for auto-approve/merge."
            exit 1
          fi

      - name: Approve pull request
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.BASKET_REFRESH_GH_TOKEN }}

      - name: Wait for required checks
        env:
          GH_TOKEN: ${{ secrets.BASKET_REFRESH_GH_TOKEN }}
        run: |
          gh pr checks "${{ github.event.pull_request.number }}" --watch --fail-fast --interval 30

      - name: Squash merge with admin bypass
        env:
          GH_TOKEN: ${{ secrets.BASKET_REFRESH_GH_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --admin \
            --squash \
            --delete-branch
