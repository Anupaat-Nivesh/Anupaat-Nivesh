<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Download Anupaat Nivesh App - Smart investment platform for mutual funds, SIP, and wealth management">
  <title>Anupaat Nivesh App Download</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #dc3545 0%, #ff5a5f 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 40px;
      font-weight: bold;
    }
    
    h1 {
      color: #212529;
      font-size: 24px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    
    .subtitle {
      color: #6c757d;
      font-size: 16px;
      margin-bottom: 30px;
    }
    
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #dc3545;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .manual-links {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px solid #e9ecef;
    }
    
    .manual-links p {
      color: #6c757d;
      font-size: 14px;
      margin-bottom: 15px;
    }
    
    .links {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .link-btn {
      display: inline-block;
      padding: 12px 24px;
      background: #dc3545;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    
    .link-btn:hover {
      background: #c82333;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
    }
    
    .link-btn.secondary {
      background: #6c757d;
    }
    
    .link-btn.secondary:hover {
      background: #5a6268;
    }
  </style>
  <script>
    function redirectUser() {
      const ua = navigator.userAgent.toLowerCase();
      
      const androidLink = "https://play.google.com/store/apps/details?id=com.dwt.AnupaatNivesh";
      const iosLink = "https://apps.apple.com/us/app/anupaat-nivesh/id6446801290";
      const fallback = "https://anupaatnivesh.com/ourApp";
      
      // Check for Android
      if (ua.includes("android")) {
        window.location.href = androidLink;
        return;
      }
      
      // Check for iOS (iPhone, iPad, iPod)
      if (ua.includes("iphone") || ua.includes("ipad") || ua.includes("ipod")) {
        window.location.href = iosLink;
        return;
      }
      
      // Fallback for desktop or other devices
      window.location.href = fallback;
    }
    
    // Redirect immediately on page load
    window.onload = function() {
      redirectUser();
    };
  </script>
</head>
<body>
  <div class="container">
    <div class="logo">AN</div>
    <h1>Anupaat Nivesh App</h1>
    <p class="subtitle">Redirecting to app store...</p>
    <div class="spinner"></div>
    
    <div class="manual-links">
      <p>If you're not redirected automatically, choose your platform:</p>
      <div class="links">
        <a href="https://play.google.com/store/apps/details?id=com.dwt.AnupaatNivesh" class="link-btn">Android</a>
        <a href="https://apps.apple.com/us/app/anupaat-nivesh/id6446801290" class="link-btn">iOS</a>
        <a href="https://anupaatnivesh.com/ourApp" class="link-btn secondary">Website</a>
      </div>
    </div>
  </div>
</body>
</html>
